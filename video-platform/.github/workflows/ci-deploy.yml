name: CI / Deploy

on:
  push:
    branches: [main]
  # Run manually to rebuild and deploy everything, e.g. after `terraform apply`
  # recreated the stack (fresh ECR repos are empty).
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT: video-platform
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'video-platform-cluster' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
            worker:
              - 'services/worker/**'
            frontend:
              - 'services/frontend/**'
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=["api","worker"]' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo "services=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "frontend"))')" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint & test (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -v

  deploy:
    name: Build, scan & deploy (${{ matrix.service }})
    needs: [changes, test]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "local/$SERVICE:${{ github.sha }}" "services/$SERVICE"

      # Trivy runs from its pinned container image, before any AWS credentials exist
      # in the job, so the scanner never has access to them.
      - name: Scan image with Trivy (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --no-progress \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            "local/$SERVICE:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --no-progress --quiet \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "local/$SERVICE:${{ github.sha }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # OIDC when AWS_ROLE_ARN is set; otherwise static keys (AWS Academy Learner Lab).
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Push image to ECR
        id: push
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/$PROJECT-$SERVICE"
          docker tag "local/$SERVICE:${{ github.sha }}" "$REPO:${{ github.sha }}"
          docker tag "local/$SERVICE:${{ github.sha }}" "$REPO:latest"
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:latest"
          echo "image=$REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$PROJECT-$SERVICE" \
            --query taskDefinition > task-definition.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.push.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        id: deploy
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.PROJECT }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # If the circuit breaker rolled back, the service is "stable" on the OLD revision.
      - name: Verify new revision is live (not rolled back)
        run: |
          LIVE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$PROJECT-$SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          echo "expected: ${{ steps.deploy.outputs.task-definition-arn }}"
          echo "live:     $LIVE"
          if [ "$LIVE" != "${{ steps.deploy.outputs.task-definition-arn }}" ]; then
            echo "::error::Deployment was rolled back by the ECS circuit breaker"
            exit 1
          fi

  frontend:
    name: Deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Resolve bucket and distribution
        id: target
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${{ vars.FRONTEND_BUCKET }}"
          DIST_ID="${{ vars.CLOUDFRONT_DIST_ID }}"
          [ -n "$BUCKET" ] || BUCKET="$PROJECT-frontend-$ACCOUNT"
          [ -n "$DIST_ID" ] || DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='$PROJECT'].Id | [0]" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      # The page calls the API through CloudFront's /api/* behavior (same HTTPS origin).
      - name: Inject API base URL
        run: echo 'window.API_BASE_URL = "/api";' > services/frontend/config.js

      - name: Sync to S3
        run: |
          aws s3 sync services/frontend "s3://${{ steps.target.outputs.bucket }}" \
            --delete --cache-control "public, max-age=60"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.dist_id }}" --paths "/*"

  smoke-test:
    name: Smoke test
    needs: [deploy, frontend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Check /health on ALB and through CloudFront
        run: |
          ALB="${{ vars.ALB_DNS_NAME }}"
          [ -n "$ALB" ] || ALB=$(aws elbv2 describe-load-balancers --names "$PROJECT-alb" \
            --query "LoadBalancers[0].DNSName" --output text)
          CF=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='$PROJECT'].DomainName | [0]" --output text)
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "http://$ALB/health"
          echo
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://$CF/api/health"
          echo
          echo "App URL: https://$CF" >> "$GITHUB_STEP_SUMMARY"
